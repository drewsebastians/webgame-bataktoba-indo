name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Runtime stays dependency-free; only devDependencies (Playwright) install.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install pinned Lighthouse CLI
        run: npx --yes lighthouse@13.4.1 --version

      # Corpus databases are NOT rebuilt in CI (they require the 1.6 GB local
      # alignment DB); CI validates the committed published outputs instead.

      - name: Full verification (check + unit + build + smoke + browser + axe + Lighthouse)
        run: npm run verify:release

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: artifacts/lighthouse/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Committed dist drift gate
        run: git diff --exit-code -- dist
