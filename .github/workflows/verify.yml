name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Runtime stays dependency-free; only devDependencies (Playwright) install.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Corpus databases are NOT rebuilt in CI (they require the 1.6 GB local
      # alignment DB); CI validates the committed published outputs instead.

      - name: Full verification (check + unit + build + smoke + browser + axe)
        run: npm run verify

      - name: Committed dist drift gate
        run: git diff --exit-code -- dist
