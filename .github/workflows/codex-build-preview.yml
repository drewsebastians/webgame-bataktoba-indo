name: Temporary public dist build preview

on:
  pull_request:
    branches: [main]

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'codex/2026-11-10-mobile-nav-escape'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build production dist
        run: npm run build
      - name: Confirm no synthetic fixture markers and print generated hashes
        run: |
          if grep -R -E 'SYNTHETIC_TEST_ONLY|SYNTHETIC_' dist; then exit 1; fi
          find dist/assets/js -maxdepth 1 -name 'app.*.js' -printf '%f\n'
          grep -E '^const CACHE_VERSION' dist/sw.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: temporary-public-dist-${{ github.event.pull_request.head.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
